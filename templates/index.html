<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop OS — Taller al Aire Libre</title>
    <meta name="description" content="Planificación climática y gestión de tareas para taller de carpintería al aire libre.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                    colors: {
                        canvas: '#1B1714',
                        surface: '#241F1A',
                        surface2: '#2D2721',
                        hairline: '#3A332C',
                        ink: '#EDE4D3',
                        ink2: '#A69C8C',
                        ink3: '#726858',
                        brass: '#C08A3E',
                        brassdim: '#8C6A38',
                        moss: '#7C9070',
                        rust: '#B15C42',
                        chalk: '#6B8CA3',
                    },
                    boxShadow: {
                        panel: '0 1px 0 0 rgba(255,255,255,0.02) inset, 0 12px 30px -18px rgba(0,0,0,0.7)',
                    }
                },
            },
        }
    </script>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="bg-canvas text-ink min-h-screen antialiased overflow-x-hidden">

    <!-- SPRITE DE ÍCONOS -->
    <svg class="hidden">
        <defs>
            <symbol id="i-mark" viewBox="0 0 32 32"><path d="M4 24 L16 6 L28 24 Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 24 L16 15 L21 24" fill="none" stroke="currentColor" stroke-width="2"/><line x1="4" y1="24" x2="28" y2="24" stroke="currentColor" stroke-width="2"/></symbol>
            <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1L5.6 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
            <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
            <symbol id="i-chev-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
            <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
            <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
            <symbol id="i-edit" viewBox="0 0 24 24"><path d="M16.5 4.5l3 3L8 19H5v-3L16.5 4.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
            <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.4-7-11.5A7 7 0 0119 9.5C19 14.6 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-4.5-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
            <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-8 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M3 4v4h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
            <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
            <symbol id="i-star-filled" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
            <symbol id="i-chevron-down-sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
            <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.3 9.3a2.7 2.7 0 115.1 1.4c-.5.9-1.4 1.1-1.9 1.9-.3.5-.4 1-.4 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/></symbol>
            <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.4M12 19v2.4M4.2 12H1.8M22.2 12h-2.4M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7L5.6 18.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
            <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M6.5 18a4 4 0 01-.5-7.97A5 5 0 0116 8a3.5 3.5 0 013.5 3.5c0 .17-.01.33-.03.5A3.5 3.5 0 0119 18H6.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
            <symbol id="i-cloud-sun" viewBox="0 0 24 24"><circle cx="7.5" cy="7.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 2.8v1.4M7.5 12v-1.3M2.8 7.5h1.4M2.8 4l1.2 1.2M11.2 4L10 5.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8 19a3.6 3.6 0 01-.4-7.18A4.6 4.6 0 0116.4 10a3.1 3.1 0 013.1 3.1c0 .16 0 .3-.03.45A3.1 3.1 0 0119 19H8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
            <symbol id="i-cloud-rain" viewBox="0 0 24 24"><path d="M6.5 15a4 4 0 01-.5-7.97A5 5 0 0116 5a3.5 3.5 0 013.5 3.5c0 .17-.01.33-.03.5A3.5 3.5 0 0119 15H6.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 18.5l-1 2.3M12.5 18.5l-1 2.3M17 18.5l-1 2.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
        </defs>
    </svg>

    <!-- HEADER -->
    <header class="border-b border-hairline bg-canvas/90 backdrop-blur-sm sticky top-0 z-50">
        <div class="max-w-[1440px] mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 sm:w-11 sm:h-11 shrink-0 rounded-lg bg-surface2 border border-hairline flex items-center justify-center text-brass">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6"><use href="#i-mark"/></svg>
                </div>
                <div class="min-w-0">
                    <h1 class="font-display text-xl sm:text-2xl font-semibold tracking-tight text-ink leading-none">
                        Workshop OS
                    </h1>
                    <p class="text-[11px] sm:text-xs text-ink3 font-medium tracking-wide mt-1">Taller de carpintería al aire libre</p>
                </div>
            </div>

            <div class="flex flex-wrap items-stretch gap-2 sm:gap-3">
                <form action="/evaluation/force_run" method="post" class="flex items-center gap-2 bg-surface border border-hairline rounded-lg px-3 py-2">
                    <span class="text-[11px] text-ink3 font-medium hidden md:inline whitespace-nowrap">Escenario</span>
                    <select name="scenario" id="scenario" class="bg-surface2 text-ink border border-hairline rounded-md px-2.5 py-1.5 text-sm focus:outline-none cursor-pointer min-w-0">
                        <option value="" {% if current_scenario == 'real' %}selected{% endif %}>Clima real (Open-Meteo)</option>
                        <option value="sunny" {% if current_scenario == 'sunny' %}selected{% endif %}>Simular: soleado ideal</option>
                        <option value="morning_rain" {% if current_scenario == 'morning_rain' %}selected{% endif %}>Simular: lluvia matutina</option>
                        <option value="afternoon_rain" {% if current_scenario == 'afternoon_rain' %}selected{% endif %}>Simular: lluvia de tarde</option>
                        <option value="buffer_rain" {% if current_scenario == 'buffer_rain' %}selected{% endif %}>Simular: lluvia en buffer de secado</option>
                    </select>
                    <button type="submit" class="bg-brass hover:bg-brassdim text-canvas text-sm font-semibold px-3.5 py-1.5 rounded-md transition-colors whitespace-nowrap">
                        Evaluar
                    </button>
                </form>

                <button type="button" onclick="openSettingsModal()" aria-label="Configuración" class="flex items-center gap-2 bg-surface hover:bg-surface2 border border-hairline hover:border-brassdim text-ink2 hover:text-ink px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                    <svg class="w-4 h-4"><use href="#i-gear"/></svg>
                    <span class="hidden md:inline">Configuración</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN GRID -->
    <main class="max-w-[1440px] mx-auto px-4 sm:px-6 py-6 sm:py-8">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-8">

            {% include "components/backlog.html" %}

            {% include "components/agenda.html" %}

        </div>
    </main>

    {% include "components/settings_modal.html" %}

    <div id="toast" class="fixed bottom-6 right-6 left-6 sm:left-auto z-[100] bg-moss text-canvas px-5 py-3 rounded-lg font-semibold text-sm shadow-2xl hidden toast-animate"></div>

    <script src="/static/js/backlog.js"></script>
    <script src="/static/js/agenda.js"></script>
    <script src="/static/js/settings.js"></script>
    <script src="/static/js/map.js"></script>
</body>
</html>
